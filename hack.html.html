<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시스템 해킹됨</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            overflow: hidden;
        }

        /* 화면 흔들림 효과 */
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* 버튼 깜빡임 효과 */
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px red; }
            50% { transform: scale(1.05); box-shadow: 0 0 20px red; }
            100% { transform: scale(1); box-shadow: 0 0 10px red; }
        }

        #start-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            background: #ff0000;
            color: white;
            border: 2px solid #ff0000;
            cursor: pointer;
            animation: pulse 1s infinite;
            font-weight: bold;
        }

        #hack-screen {
            display: none;
            text-align: center;
            width: 90%;
        }

        #hack-screen.active {
            display: block;
            animation: shake 0.5s infinite;
        }

        h1 {
            font-size: 2rem;
            text-shadow: 0 0 10px red;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #333;
            margin: 20px 0;
            position: relative;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: red;
            animation: fillBar 3s linear forwards;
        }

        @keyframes fillBar {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        
        .warning {
            font-size: 0.8rem;
            color: #fff;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="start-btn" onclick="startHacking()">
        SYSTEM HACKED<br>
        <span style="font-size:0.8rem">Tap to confirm</span>
    </div>

    <div id="hack-screen">
        <h1>⚠️ 시스템 해킹됨 ⚠️</h1>
        <p>에러 코드: 99-X</p>
        
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <p>데이터 탈취 중...</p>
        <p class="warning">전원 끄지 마시오</p>
    </div>

    <script>
        function startHacking() {
            // 시작 화면 숨기기
            document.getElementById('start-btn').style.display = 'none';
            
            // 해킹 화면 보이기 및 흔들기
            document.getElementById('hack-screen').classList.add('active');

            // 전체화면 시도 (에러가 나도 무시)
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {});
            }
        }
    </script>
</body>
</html>
